name: gband_monitor
description: "G band monitor"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Permissions
  permission_handler: ^12.0.3

  # State Management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Networking
  dio: ^5.7.0

  # UI
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.19.0
  flutter_secure_storage: ^9.0.0
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^22.0.1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.5
  fl_chart: ^1.2.0
  flutter_tts: ^4.2.5
  vibration: ^3.2.0
  audioplayers: ^6.1.0
  veepoo_sdk:
    path: packages/veepoo_sdk

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
